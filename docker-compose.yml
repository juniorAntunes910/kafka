services:
  postgres:
    image: postgres:16-alpine
    container_name: aeroporto-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: aeroporto_db
      POSTGRES_USER: aeroporto_user
      POSTGRES_PASSWORD: aeroporto123

    ports:
      - "55432:5432"

    volumes:
      - aeroporto_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroporto_user -d aeroporto_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aeroporto_postgres_data: